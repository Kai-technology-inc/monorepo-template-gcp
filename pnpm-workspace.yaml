packages:
  - apps/*
  - packages/*

# One version of every shared tool. Packages ask for it with `"catalog:"`. Versions are exact on purpose:
# an upgrade is a commit that changes this file, never a side effect of `pnpm install`.
catalog:
  # Two TypeScripts: `typescript` is the 6.0 JS API (what typescript-eslint, Vitest's type checks and Next load), published
  # without the `tsc` binary so it can live next to 7. The `tsc` every script runs is the native 7.x compiler,
  # installed at the root as `tsc7` (its only bin is called `tsc`).
  typescript: 'npm:@typescript/typescript6@6.0.2'
  zod: '3.25.76'
  react: '19.3.1'
  react-dom: '19.3.1'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  '@types/node': '22.20.1'
  eslint: '10.14.0'
  '@eslint/js': '10.0.1'
  eslint-config-prettier: '10.1.8'
  eslint-plugin-prettier: '5.5.7'
  prettier: '3.10.1'
  typescript-eslint: '8.72.2'
  rxjs: '7.8.2'
  reflect-metadata: '0.2.2'
  globals: '14.0.0'
  next: '16.4.6'
  eslint-config-next: '16.4.6'
  firebase: '13.3.0'
  vitest: '5.1.0'
  '@nestjs/common': '12.5.0'
  '@nestjs/core': '12.5.0'
  '@nestjs/platform-express': '12.5.0'
  '@nestjs/swagger': '12.1.2'
  '@nestjs/testing': '12.5.0'
  firebase-admin: '14.5.1'
  firebase-functions: '7.4.0'
  express: '5.3.0'
  '@types/express': '5.0.6'
  helmet: '8.3.0'
  dotenv: '16.6.1'
  esbuild: '0.25.12'

# pnpm 12 does not run install scripts without explicit permission (ERR_PNPM_IGNORED_BUILDS). None of these is
# needed: esbuild and unrs-resolver ship their binary as an optional dependency, protobufjs and @firebase/util only
# touch their own files, scarf is telemetry and re2 is an optional dependency of superstatic (firebase-tools'
# hosting). Every new dependency with a `postinstall` stops the install until it is named here, true or false,
# with the reason.
allowBuilds:
  '@firebase/util': false
  '@scarf/scarf': false
  esbuild: false
  protobufjs: false
  re2: false
  unrs-resolver: false
