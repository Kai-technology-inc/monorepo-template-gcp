# Firebase App Hosting: base configuration of the web backend.
#
# App Hosting builds in Cloud Build from the commit, with root dir `apps/web`, and applies on top of this file the
# one of the backend's environment (environment "qa" → apphosting.qa.yaml, "prod" → apphosting.prod.yaml). Those
# hold the NEXT_PUBLIC_* values of each project and are generated by `pnpm setup:gcp <project> <env>`.
#
# Its pnpm buildpack installs with `pnpm install --prod`: everything `next build` needs (typescript, the @types it
# reads, turbo, and whatever each workspace package imports) must be in `dependencies`, not `devDependencies`.
runConfig:
  minInstances: 0
