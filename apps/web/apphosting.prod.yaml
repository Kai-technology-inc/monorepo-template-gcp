# App Hosting configuration for prod. Regenerate with: pnpm setup:gcp <project-id> prod
# Every value here is public (it ships in the browser bundle). Secrets go in Secret Manager, never here.
runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
env:
  - variable: APP_ENVIRONMENT
    value: 'prod'
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_ENVIRONMENT
    value: 'prod'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 'REPLACE_ME'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 'REPLACE_ME'
    availability:
      - BUILD
