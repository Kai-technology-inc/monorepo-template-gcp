# Minor and patch updates arrive grouped (one PR per family); a major version arrives alone, because it usually needs
# code changes and a closer look than "CI is green".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # The Node types follow the runtime (Node 22 on Cloud Functions, App Hosting and CI), not the latest Node:
      # newer types would accept APIs production does not have. Bump them with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      nest:
        patterns: ['@nestjs/*']
        update-types: [minor, patch]
      firebase:
        patterns: ['firebase', 'firebase-*', '@firebase/*']
        update-types: [minor, patch]
      next-react:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
        update-types: [minor, patch]
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'turbo']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
